    - {id: learn-session-persists, scenario: null, tests: [tests/test_study.py::test_a_session_survives_a_restart, tests/test_study.py::test_a_session_completes_only_when_every_objective_is_met, tests/test_study.py::test_a_session_is_never_an_instruction_to_a_brain], outcome: "A learning session he starts persists its topic, objectives and progress across a restart."}
    - {id: learn-answer-checked, scenario: null, tests: [tests/test_study.py::test_an_answer_is_graded_and_every_attempt_kept, tests/test_study.py::test_a_source_that_no_longer_says_it_makes_the_answer_unverifiable, tests/test_study.py::test_an_exercise_the_source_does_not_support_is_refused], outcome: "An exercise answer is checked against a fresh source and the result recorded, not asserted."}
# Mandatory: every one must pass, every repeat. A single failure fails the hard gate.
  case:
