# Hands, layer two — his apps through their own doors.
#
# "even i ask to create a data in exceel it has to do" was the first half; this
# is the second. A reminder goes into Reminders by asking Reminders, and a
# scenario asserts the DOOR was used — his real list is never opened.

scenarios:
  - id: a-reminder-he-asks-for-lands-in-reminders
    title: '"remind me to chase the PR" goes into his Reminders list'
    why: >
      The act is checkable at the door: a named recipe, arguments he can read,
      and a read-back inside the tool before it reports success.
    twin: false
    brains:
      chat:
        - calls: [{tool: use_app, args: {recipe: reminder_add,
                   args: {title: "Chase the 1440 review", note: "3 PRs waiting"}}}]
          text: "Added it to your Reminders."
    steps:
      - say: "remind me to chase the 1440 review"
    checks:
      - app_door: {recipe: reminder_add, args_contain: "1440 review"}
      - tool_result_contains: {tool: use_app, text: "Done in Reminders"}

  - id: a-recipe-that-does-not-exist-is-refused-not-improvised
    title: A brain cannot invent a recipe, and cannot write a script
    why: >
      A model that can write AppleScript can empty his calendar. The recipes are
      a closed list read once by a person; everything else is a refusal.
    twin: false
    brains:
      chat:
        - calls: [{tool: use_app, args: {recipe: empty_the_calendar, args: {}}}]
          text: "I can't do that one."
    steps:
      - say: "clear my whole calendar for next week"
    checks:
      - tool_result_contains: {tool: use_app, text: "Not done"}
      - app_door: {count: 0}

  - id: mail-is-drafted-never-sent-from-the-app-door
    title: The Mail door leaves a draft; sending stays behind its own gate
    why: >
      Two routes to the same outward act is one route too many — the second one
      always turns out to be the ungated one.
    twin: false
    brains:
      chat:
        - calls: [{tool: use_app, args: {recipe: mail_draft,
                   args: {to: "someone@example.com", subject: "Kafka topics for UAT",
                          body: "Draft for Arun to check."}}}]
          text: "Draft is open in Mail for you."
    steps:
      - say: "draft a mail about the uat kafka topics"
    checks:
      - app_door: {recipe: mail_draft, args_contain: "Kafka topics"}
      - no_send: true
