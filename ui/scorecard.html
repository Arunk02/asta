<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Asta scorecard</title>
<style>
:root{--ground:#F3F5F8;--surface:#fff;--ink:#131A24;--muted:#5B6576;--rule:#D8DEE8;--accent:#2447A8;
--good:#2D7550;--good-soft:#E3F2E9;--warn:#8F5B00;--warn-soft:#FAF0DA;--bad:#B73A26;--bad-soft:#FBE9E5;--na:#8A93A3;--na-soft:#EEF1F5}
@media (prefers-color-scheme:dark){:root{--ground:#0F141C;--surface:#161D28;--ink:#E6EAF1;--muted:#9AA5B6;--rule:#2A3342;--accent:#8EA9FF;
--good:#7FD3A1;--good-soft:#16301F;--warn:#F2B74E;--warn-soft:#3A2C10;--bad:#FF8F7A;--bad-soft:#3A1D18;--na:#6F7A8C;--na-soft:#212937}}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.5 -apple-system,"Segoe UI",system-ui,sans-serif}
main{max-width:880px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:24px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px;font-size:13px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;overflow:hidden;margin:0 0 18px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 14px;border-top:1px solid var(--rule)}
.row:first-child{border-top:0}
.label{font-weight:600}
.value{font:600 16px/1.3 ui-monospace,Menlo,monospace;text-align:right;white-space:nowrap}
.meta{color:var(--muted);font-size:12.5px;grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 14px}
.chip{display:inline-block;font:600 10.5px/1 system-ui;letter-spacing:.05em;text-transform:uppercase;padding:4px 7px;border-radius:99px;margin-left:8px;vertical-align:2px}
.good{color:var(--good);background:var(--good-soft)}.warn{color:var(--warn);background:var(--warn-soft)}
.bad{color:var(--bad);background:var(--bad-soft)}.na{color:var(--na);background:var(--na-soft)}
.spark{display:inline-flex;gap:2px;align-items:flex-end;height:18px;vertical-align:middle}
.spark i{display:block;width:5px;background:var(--accent);opacity:.55;border-radius:1px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:22px 0 8px}
.brains{display:flex;flex-wrap:wrap;gap:8px}
.brain{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:8px 10px;font-size:13px}
.msg{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:16px}
</style>
</head>
<body>
<main>
  <h1>Asta scorecard</h1>
  <p class="sub" id="sub">Loading…</p>
  <div id="out"></div>
</main>
<script>
(function () {
  const q = new URLSearchParams(location.search);
  const token = q.get("token") || localStorage.getItem("asta_token") || "";
  const out = document.getElementById("out");
  const sub = document.getElementById("sub");
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  function spark(hist, key) {
    const vals = hist.map(h => h.values[key]).filter(v => typeof v === "number");
    if (vals.length < 2) return "";
    const max = Math.max(...vals) || 1;
    return '<span class="spark" title="daily, oldest first">' +
      vals.slice(-14).map(v => '<i style="height:' + Math.max(2, Math.round(18 * v / max)) + 'px"></i>').join("") + "</span>";
  }
  fetch("/api/scorecard", {headers: {Authorization: "Bearer " + token}})
    .then(r => { if (r.status === 401) throw new Error("auth"); return r.json(); })
    .then(card => {
      const when = new Date(card.generated_at * 1000).toLocaleString();
      sub.textContent = "Last " + card.window_days + " days · " + when + " · targets from the Astra-class plan";
      const rows = card.rows.map(r =>
        '<div class="row"><div class="label">' + esc(r.label) + '<span class="chip ' + r.state + '">' + r.state + '</span></div>' +
        '<div class="value">' + spark(card.history || [], r.key) + " " + esc(r.shown) + '</div>' +
        '<div class="meta"><span>target ' + esc(r.target) + '</span>' + (r.note ? '<span>' + esc(r.note) + '</span>' : '') + '</div></div>'
      ).join("");
      const brains = Object.entries(card.brains || {}).map(([k, v]) =>
        '<div class="brain"><b>' + esc(k) + '</b> · ' + esc(v) + '</div>').join("");
      out.innerHTML = '<div class="card">' + rows + '</div>' +
        '<h2>Brains right now</h2><div class="brains">' + brains + '</div>' +
        '<h2>Sessions retired for size</h2><div class="brain">' + card.sessions_rotated + ' in this window</div>';
    })
    .catch(e => {
      sub.textContent = "";
      out.innerHTML = '<div class="msg">' + (e.message === "auth"
        ? "Open Asta's main page once on this device (it saves your token), then come back — or add <code>?token=…</code> to this address."
        : "Could not load the scorecard: " + esc(e.message)) + "</div>";
    });
})();
</script>
</body>
</html>
