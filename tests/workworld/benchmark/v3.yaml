    - {id: case-named-target-not-asked, tests: [tests/test_do_what_he_said.py::test_the_brain_is_told_to_do_it_instead_of_asking, tests/test_do_what_he_said.py::test_a_real_question_still_goes_to_him], outcome: "A repo, environment or PR he named is not asked back as a choice; a real question still goes to him."}
    - {id: case-handed-over, tests: [tests/test_case_carries_over.py::test_approving_a_reply_hands_their_case_over, tests/test_case_carries_over.py::test_the_hand_over_ends_and_a_group_send_is_not_one], outcome: "Approving a reply hands that person's case over for a bounded time, so their follow-ups are investigated, not stopped on the incident rule."}
    - {id: case-findings-carried, tests: [tests/test_case_carries_over.py::test_a_follow_up_brief_carries_earlier_findings_and_what_was_said], outcome: "A follow-up's brief carries the case's earlier findings, marked as possibly wrong, and what was already said to them."}
    - {id: case-absence-not-proven, tests: [tests/test_conversation_integrity.py::test_zero_log_lines_is_never_presented_as_absence], outcome: "A zero-hit log search says it is not proof of absence and names the positive control to run."}
    - {id: case-no-defect-ends, tests: [tests/test_prove_first_no_change.py::test_no_change_completes_the_task_with_its_proof, tests/test_prove_first_no_change.py::test_the_graph_has_the_route, tests/test_prove_first_no_change.py::test_a_real_escalation_still_escalates], outcome: "A prove-first code task that proves nothing is wrong ends done with its proof; a real escalation still escalates."}
    - {id: case-old-draft-held, scenario: a-yes-hours-later-does-not-send-an-old-draft, outcome: "A yes hours later shows the old draft again instead of sending it."}
    - {id: case-correction-raised, scenario: null, note: "The brief asks for 'Corrects:' and a correction REPLY when evidence contradicts what was said. Nothing yet raises a correction draft by itself when a later task overturns a sent reply.", outcome: "A finding that contradicts a reply already sent raises one correction draft for his yes."}
authority:
