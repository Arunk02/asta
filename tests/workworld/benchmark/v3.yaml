    - {id: debug-prod-from-loki, scenario: a-production-question-is-answered-from-production, outcome: "A production question reads Loki through the API and answers from what it found."}
    - {id: debug-temporal-state, scenario: a-stuck-workflow-is-read-from-temporal, outcome: "A stuck-workflow question reads Temporal and says what the workflow is waiting on."}
    - {id: debug-engineer-brief, scenario: a-bug-report-briefs-a-debugging-engineer, outcome: "A bug report is briefed to the brain as a debugging engineer's task."}
    - {id: debug-site-brief, scenario: a-production-question-briefs-a-site-engineer, outcome: "A production outage is briefed as a site engineer's investigation."}
    - {id: debug-handover-checked, scenario: a-handed-over-booking-id-is-looked-at, outcome: "A colleague's handed-over id is investigated, not just acknowledged."}
    - {id: debug-404-is-answer, scenario: a-jira-404-is-an-answer, outcome: "An unreadable ticket comes back as a sentence, not a traceback."}
    - {id: debug-limit-pauses, scenario: limit-mid-analysis-pauses, outcome: "A usage limit mid-analysis pauses the work and schedules its own return."}
    - {id: debug-limit-hands-over, scenario: limit-then-the-other-brain, outcome: "A limit on one brain hands the analysis to another brain that is up."}
    - {id: debug-booking-both-ways, scenario: null, tests: [tests/test_booking_case.py::test_the_check_looks_both_ways_at_every_hand_off_and_summarises, tests/test_booking_case.py::test_each_flow_is_reported_in_its_own_direction, tests/test_booking_case.py::test_an_id_without_its_environment_is_asked_which_never_assumed_prod, tests/test_booking_case.py::test_the_investigation_never_defaults_to_production, tests/test_booking_case.py::test_the_investigation_brief_gets_the_evidence], outcome: "A booking question fetches logs for each flow in both directions, asks the environment instead of assuming prod, and cites the evidence it fetched."}
  apps:
    - {id: app-reminder, scenario: a-reminder-he-asks-for-lands-in-reminders, outcome: "'remind me to …' creates an entry in his Reminders list."}
    - {id: app-no-invented-recipe, scenario: a-recipe-that-does-not-exist-is-refused-not-improvised, outcome: "A brain cannot invent an app recipe or write a script in its place."}
    - {id: app-mail-draft-only, scenario: mail-is-drafted-never-sent-from-the-app-door, outcome: "The Mail door leaves a draft; nothing is sent."}
    - {id: app-open-intellij, scenario: open-intellij-opens-intellij, outcome: "'open intellij' opens IntelliJ with no brain call."}
    - {id: app-open-site, scenario: open-youtube-opens-the-site, outcome: "'open youtube in chrome' opens that site in the named browser."}
    - {id: app-reminders-list, scenario: opening-my-reminders-is-about-the-list-not-the-window, outcome: "'open my reminders' reads the list rather than only launching the app."}
    - {id: app-door-before-mouse, scenario: the-mouse-is-refused-where-a-door-exists, outcome: "An app with a scripting door is never driven by clicks."}
    - {id: app-failed-click-stops, scenario: a-click-that-does-nothing-stops-the-sequence, outcome: "A step whose expectation does not come true halts the sequence and says what it saw."}
    - {id: app-sheet-is-real, scenario: a-sheet-he-asks-for-is-a-real-file, outcome: "A spreadsheet he asks for is a real file with the requested rows."}
    - {id: app-deck-is-real, scenario: a-deck-he-can-show-people, outcome: "A deck he asks for is a real file with the table on a slide."}
  communication:
    - {id: comm-nothing-without-yes, scenario: nothing-outward-without-a-yes, outcome: "Asta drafts; nothing is sent until he says yes."}
    - {id: comm-his-ask-is-yes, scenario: a-send-he-asked-for-is-his-yes, outcome: "When he names the person and says tell them, it is sent exactly once with no second confirmation."}
    - {id: comm-draft-once, scenario: a-draft-is-sent-only-on-approve, outcome: "A Teams draft waits and is sent exactly once on approve."}
    - {id: comm-no-drops-draft, scenario: no-to-a-staged-draft-drops-it, outcome: "'no' to a staged draft drops it without a brain call or a re-staged draft."}
    - {id: comm-nudge-staged, scenario: a-nudge-is-staged-and-never-sent, outcome: "A stalled promise produces a chase draft for his yes; nothing leaves."}
    - {id: comm-deadline-question, scenario: a-warning-before-the-deadline-waits-for-his-word, outcome: "A deadline warning asks 'chase or leave it' and acts on his answer."}
    - {id: comm-direct-question-reaches, scenario: a-person-asking-him-something-is-never-budgeted, outcome: "A colleague's direct question reaches him even past the day's interruption budget."}
    - {id: comm-greeting-then-ask, scenario: the-ask-that-follows-is-the-one-that-counts, outcome: "The question typed after a greeting is the one investigated."}
    - {id: comm-two-conversations, scenario: two-people-waiting-are-two-conversations, outcome: "Two colleagues waiting are handled as two separate conversations."}
    - {id: comm-live-sounds-like-him, scenario: live-a-draft-sounds-like-him, outcome: "A real brain's drafted reply is short and in his voice."}
  calls:
    - {id: call-heads-up-voice, scenario: something-he-would-rather-hear-is-said-out-loud, outcome: "A short heads-up can arrive as his assistant's voice."}
    - {id: call-greeting-first, scenario: null, tests: [tests/test_call_voice.py::test_the_greeting_is_made_before_anything_else_in_the_call, tests/test_call_voice.py::test_the_greeting_is_a_short_line_of_its_own], outcome: "On joining a call, the greeting is spoken first, before any answer is generated."}
    - {id: call-one-voice, scenario: null, tests: [tests/test_call_voice.py::test_a_call_speaks_in_the_assistant_voice_unless_told_otherwise, tests/test_call_voice.py::test_a_call_placed_in_his_voice_speaks_every_line_in_it, tests/test_call_voice.py::test_the_ack_is_in_the_same_voice_as_the_answer, tests/test_call_voice.py::test_a_call_asked_for_in_his_voice_sets_it_before_anything_is_said], outcome: "One voice is chosen per call and does not change mid-call."}
    - {id: call-verified-joined, scenario: null, tests: [tests/test_call_states.py::test_being_let_in_is_recorded_as_joining, tests/test_call_states.py::test_a_meeting_never_let_in_is_left_and_not_reported_as_attended, tests/test_call_states.py::test_the_screen_tells_the_lobby_apart, tests/test_call_lifecycle.py::test_a_ringing_phone_is_not_a_connected_call, tests/test_call_lifecycle.py::test_nothing_is_said_into_a_ringing_phone], outcome: "A call is reported as joined only after the call state is verified, never on the click alone."}
    - {id: call-answer-from-context, scenario: null, tests: [tests/test_project_knowledge.py::test_a_voice_question_is_answered_from_the_knowledge_without_a_job, tests/test_call_lifecycle.py::test_a_code_question_is_answered_out_loud_when_asta_is_alone, tests/test_call_lifecycle.py::test_a_spoken_answer_is_trimmed_to_something_listenable], outcome: "A question in a call is answered from his project knowledge, in spoken length."}
    - {id: call-unknown-says-so, scenario: null, tests: [tests/test_call_lifecycle.py::test_the_holding_line_comes_first, tests/test_call_lifecycle.py::test_the_holding_line_promises_only_to_come_back, tests/test_call_lifecycle.py::test_when_no_brain_can_answer_it_asks_him_instead], outcome: "A call question nothing covers is answered with 'I'll check and come back', not a guess."}
    - {id: call-no-commitments, scenario: null, tests: [tests/test_call_lifecycle.py::test_a_question_for_arun_is_never_answered_for_him, tests/test_call_lifecycle.py::test_the_mid_call_brain_cannot_change_anything], outcome: "Nothing is promised on his behalf in a call; requests become follow-ups for him."}
    - {id: call-prep-brief, scenario: null, tests: [tests/test_meeting_actions.py::test_prep_reads_the_meetings_own_chat, tests/test_meeting_actions.py::test_without_a_meeting_chat_the_organisers_thread_is_read, tests/test_meeting_prep.py::test_prep_uses_the_local_model_when_up], outcome: "Before a meeting, he gets a brief from the invite, the thread and the related work."}
