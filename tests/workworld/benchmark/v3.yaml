    - {id: call-leaves-cleanly, scenario: null, tests: [tests/test_meetings.py::test_hanging_up_closes_the_browser_and_clears_the_flag, tests/test_meetings.py::test_joining_twice_is_refused, tests/test_call_lifecycle.py::test_a_call_nobody_answers_is_hung_up_and_reported, tests/test_call_lifecycle.py::test_sleeping_through_a_call_ends_it_and_says_so], outcome: "Leaving a call, or a call ending on its own, closes the browser and clears the in-call state, so the next call is not refused as already in one."}
  memory:
