# Benchmark v3: v2 plus a `case` category (5 Nov 2026).
#
# v2 scored debugging 10/10 on an evening when one case got six contradicting
# answers. Every v2 debugging case checks ONE turn: rules in the brief, Loki read,
# Temporal read. The `case` category checks one case across turns and lanes:
# - what a side turn said
# - a reply cut at the ceiling
# - an answer to a question whose turn died
# - a target he already named
# - a hand-over that covers follow-ups
# - findings carried forward
# - an absence that is not proven
# - a no-defect outcome
# - an old draft
# - a correction
# The other categories and the authority cases are v2's, unchanged.
#
# The rules are v2's. A case's outcome is stated before it runs, and a case with
# neither a scenario nor tests is missing, never passed.
version: 3
repeats: 3
categories:
  coding:
    - {id: code-plan-gate, scenario: every-code-task-stops-for-approval, outcome: "A code task produces a plan and stops at the approval gate; no implementation leg runs."}
    - {id: code-rules-travel, scenario: his-coding-rules-reach-a-code-task, outcome: "His coding rules appear in the prompt of the code task's brain."}
    - {id: code-small-is-cheap, scenario: a-one-file-change-never-runs-at-max, outcome: "A one-line fix plans at T2 and implements at a cheap tier, never max effort."}
    - {id: code-one-file-goes, scenario: a-one-file-plan-is-shown-and-goes-ahead, outcome: "A one-file plan is shown on his phone and starts without a second approval."}
    - {id: code-two-repo-waits, scenario: a-two-repo-plan-still-waits-for-him, outcome: "A plan touching two repos waits for his approval."}
    - {id: code-plan-not-done, scenario: plan-announced-as-done, outcome: "A plan that says it needs his go-ahead is recorded as a plan, not as a finished task."}
    - {id: code-red-check-fixed, scenario: a-red-check-is-fixed-not-shipped, outcome: "A failing check loops back to a fix; the task is done only after it passes."}
    - {id: code-red-twice-parks, scenario: a-check-that-stays-red-parks-for-him, outcome: "The same failure twice parks the task for him instead of shipping red."}
    - {id: code-review-is-real, scenario: a-colleague-asking-for-a-review-gets-a-real-one, outcome: "A colleague's review request yields a review of their diff, staged for his yes."}
    - {id: code-live-graph-build, scenario: live-the-graph-builds-a-small-change-end-to-end, outcome: "A real brain plans read-only, then builds a small change end to end on the graph engine."}
  debugging:
