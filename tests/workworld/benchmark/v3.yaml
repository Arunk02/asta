  learning:
    - {id: learn-overclaim-corrected, scenario: a-claim-that-overstates-itself-is-corrected, outcome: "A confidence claim taken as written only half the time is corrected."}
    - {id: learn-honest-claim-kept, scenario: a-claim-that-means-what-it-says-is-left-alone, outcome: "A claim that holds nine times in ten is left alone."}
