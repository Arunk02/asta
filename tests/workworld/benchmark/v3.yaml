    - {id: mem-unknown-says-so, scenario: what-it-does-not-know-it-says, outcome: "A question his documents do not cover is answered with 'nothing covers this'."}
    - {id: mem-default-workspace, scenario: his-default-workspace-is-used-when-the-chat-has-none, outcome: "His stated default workspace routes code work when the chat names none."}
    - {id: mem-rule-not-folded, scenario: a-standing-rule-is-never-folded-into-the-turn-that-is-running, outcome: "A 'remember always' instruction becomes a rule, not an addition to the running turn."}
    - {id: mem-instruction-to-rule, scenario: a-standing-instruction-becomes-a-rule-on-his-yes, outcome: "A standing instruction is proposed once as a rule and kept on his yes."}
    - {id: mem-session-retired, scenario: a-grown-session-is-retired-before-the-next-message, outcome: "A session past the size cap is retired and the thread continues with its context."}
    - {id: mem-restart-keeps-work, scenario: restart-does-not-strand-work, outcome: "A restart picks running work back up instead of leaving it marked running."}
    - {id: mem-feedback-to-task, scenario: a-named-finished-task-takes-the-feedback, outcome: "Feedback naming a finished task continues that task."}
    - {id: mem-path-kept, scenario: a-path-that-worked-is-kept-for-next-time, outcome: "A verified app sequence is saved as a named path for next time."}
